# DSH 0.1.2+ overlay for the official `sdk` profile and OpenCode Go route.
#
# OPENCODE_API_KEY is a credential reference only. Its value must arrive from
# the launching environment or DSH credential service and is never stored here.

- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: false

- id: system-prompt
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a focused coding subagent. Work only inside the assigned workspace and report results concisely.'

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'read-only'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: llm-pi-ai
  config:
    providers:
      opencode-go:
        apiKeyEnv: !!js process.env.DSH_MCP_CREDENTIAL_REF ?? 'OPENCODE_API_KEY'
        reasoning: max
