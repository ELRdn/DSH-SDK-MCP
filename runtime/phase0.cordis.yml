# DSH 0.1.2+ overlay for the official `sdk` profile.
#
# This is a patch layer, not a complete Cordis composition. The SDK client
# launches the same-version `@deepseek-ai/dsh` CLI and applies this file with
# `--patch`. stdout therefore remains exclusive to SDK JSON-RPC frames.

- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: false

- id: system-prompt
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a focused coding subagent. Work only inside the assigned workspace and report results concisely.'

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'read-only'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()
